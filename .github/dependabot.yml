version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      # These crates pin each other's versions, so bumping one alone breaks the build.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
          - "metrics-opentelemetry"
        update-types:
          - "minor"
          - "patch"
